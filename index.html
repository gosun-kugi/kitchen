<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLE キッチンスケール モニター</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
    }
    
    /* 上半分：数値表示エリア */
    #top-half {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-bottom: 2px solid #333;
    }
    
    /* 下半分：グラフエリア */
    #bottom-half {
      flex: 1;
      padding: 10px;
      box-sizing: border-box;
      position: relative;
    }

    #connectBtn {
      padding: 15px 40px;
      font-size: 1.2rem;
      border: none;
      border-radius: 30px;
      background-color: #007aff;
      color: white;
      cursor: pointer;
      transition: background-color 0.2s;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    #connectBtn:hover {
      background-color: #0056b3;
    }

    #connectBtn:disabled {
      background-color: #555;
      cursor: not-allowed;
    }

    #weight-display {
      font-size: 6rem;
      font-weight: bold;
      margin-top: 20px;
      font-variant-numeric: tabular-nums;
    }

    .unit {
      font-size: 2rem;
      color: #aaaaaa;
    }

    #status {
      margin-top: 10px;
      font-size: 0.9rem;
      color: #888;
    }
  </style>
</head>
<body>

  <div id="top-half">
    <button id="connectBtn">スケールに接続</button>
    <div id="status">未接続</div>
    <div id="weight-display">0.0 <span class="unit">g</span></div>
  </div>

  <div id="bottom-half">
    <canvas id="weightChart"></canvas>
  </div>

  <script>
    // ==========================================
    // ⚠️ お使いのデバイスに合わせて書き換えてください
    // ==========================================
    // 例: 標準的なWeight Scale ServiceのUUID
    const SERVICE_UUID = '0000ffb0-0000-1000-8000-00805f9b34fb'; 
    const CHARACTERISTIC_UUID = '0000ffb2-0000-1000-8000-00805f9b34fb';
    
    // UI要素の取得
    const connectBtn = document.getElementById('connectBtn');
    const weightDisplay = document.getElementById('weight-display');
    const statusText = document.getElementById('status');
    const ctx = document.getElementById('weightChart').getContext('2d');

    let bluetoothDevice;
    let weightCharacteristic;

    // ==========================================
    // グラフの初期化 (Chart.js)
    // ==========================================
    const maxDataPoints = 50; // グラフに表示する最大データ数（横軸の長さ）
    const chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [{
          label: '重さ (g)',
          data: [],
          borderColor: '#007aff',
          backgroundColor: 'rgba(0, 122, 255, 0.1)',
          borderWidth: 2,
          pointRadius: 0, // 点を消して滑らかな線にする
          fill: true,
          tension: 0.4
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false, // リアルタイム描画のためアニメーションをオフ
        scales: {
          x: {
            display: true,
            title: { display: true, text: '時間', color: '#888' },
            ticks: { color: '#888' },
            grid: { color: '#333' }
          },
          y: {
            display: true,
            title: { display: true, text: '重さ (g)', color: '#888' },
            ticks: { color: '#888' },
            grid: { color: '#333' },
            suggestedMin: 0
          }
        },
        plugins: {
          legend: { display: false }
        }
      }
    });

    // グラフにデータを追加する関数
    function updateChart(weight) {
      const now = new Date();
      const timeLabel = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}`;

      chart.data.labels.push(timeLabel);
      chart.data.datasets[0].data.push(weight);

      // データが最大数を超えたら古いものを削除（スクロール効果）
      if (chart.data.labels.length > maxDataPoints) {
        chart.data.labels.shift();
        chart.data.datasets[0].data.shift();
      }
      chart.update();
    }

    // ==========================================
    // BLE接続処理
    // ==========================================
    connectBtn.addEventListener('click', async () => {
      try {
        statusText.innerText = 'デバイスを探しています...';
        
        // 1. デバイスのスキャンと選択
	bluetoothDevice = await navigator.bluetooth.requestDevice({
	  acceptAllDevices: true,
	  optionalServices: [SERVICE_UUID]
	});

        statusText.innerText = '接続中...';
        bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

        // 2. GATTサーバーへ接続
        const server = await bluetoothDevice.gatt.connect();

        // 3. サービスの取得
        const service = await server.getPrimaryService(SERVICE_UUID);

        // 4. キャラクタリスティック（データ通信の窓口）の取得
        weightCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

        // 5. Notify（通知）の開始
        await weightCharacteristic.startNotifications();
        weightCharacteristic.addEventListener('characteristicvaluechanged', handleNotifications);

        statusText.innerText = `${bluetoothDevice.name} に接続済み`;
        connectBtn.innerText = '切断する';
        connectBtn.style.backgroundColor = '#ff3b30'; // 切断時は赤色に
        
        // ボタンの挙動を切断用に上書き
        connectBtn.onclick = disconnectDevice;

      } catch (error) {
        console.error('BLE Connection Error:', error);
        statusText.innerText = '接続エラー: ' + error.message;
      }
    });

    // ==========================================
    // データ受信処理
    // ==========================================


function handleNotifications(event) {
  const value = event.target.value;
  
  try {
    // 1. データの「確定フラグ」をチェック (3バイト目)
    const isStable = value.getUint8(2) === 0x01;
    statusText.innerText = isStable ? "🟢 値が確定" : "🔵 測定中...";

    // 2. 5, 6, 7バイト目（インデックス4, 5, 6）から24ビット整数（ビッグエンディアン）を合成
    const b1 = value.getUint8(4);
    const b2 = value.getUint8(5);
    const b3 = value.getUint8(6);
    
    // 3バイト結合して1つの数値にする
    let rawWeight = (b1 << 16) | (b2 << 8) | b3;

    // 3. 24ビットの「符号付き整数（2の補数）」として処理する
    // これにより、56.0gの時の巨大な値（0x0DAB60）が正しく処理されます
    if (rawWeight & 0x800000) {
      rawWeight = rawWeight - 0x1000000;
    }

    // 4. 生データをグラム換算する
    // データ構造から、1g ＝ 1000（あるいは1000に近い特定の係数）であることが確定しました。
    // 72.3gで72370、72.4gで72350なので、正確な倍率は「1001.0」付近です。
    let calculatedWeight = rawWeight / 1001.0;

    // マイナス値の絶対値が極小の場合は0リセット
    if (Math.abs(calculatedWeight) < 0.1) calculatedWeight = 0.0;
    
    // 符号を反転させる必要がある場合（もし56gを乗せたときにマイナス表示になったら、ここを calculatedWeight = -calculatedWeight; にしてください）
    // いただいたデータ傾向から、そのまま正の数として扱います
    calculatedWeight = Math.abs(calculatedWeight);

    // 画面表示用に小数点第1位に丸める
    const finalWeight = calculatedWeight.toFixed(1);

    // 画面とリアルタイムグラフの更新
    weightDisplay.innerHTML = `${finalWeight} <span class="unit">g</span>`;
    updateChart(parseFloat(finalWeight));

    // デバッグ用に画面下に生データ（16進数）を表示
    let hexString = '';
    for (let i = 0; i < value.byteLength; i++) {
      hexString += ('00' + value.getUint8(i).toString(16)).slice(-2) + ' ';
    }
    statusText.innerText += " | 生データ: " + hexString;

  } catch (e) {
    console.error("パースエラー:", e);
  }
}
    // ==========================================
    // 切断処理
    // ==========================================
    function disconnectDevice() {
      if (bluetoothDevice && bluetoothDevice.gatt.connected) {
        bluetoothDevice.gatt.disconnect();
      }
    }

    function onDisconnected() {
      statusText.innerText = '切断されました';
      connectBtn.innerText = 'スケールに接続';
      connectBtn.style.backgroundColor = '#007aff';
      connectBtn.onclick = null; // 元のイベントリスナーに戻す
      
      // 再接続用にページをリロードする簡易設計にするか、
      // 状態をリセットする処理を入れます
      setTimeout(() => { location.reload(); }, 2000); 
    }
  </script>
</body>
</html>
